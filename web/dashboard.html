<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulus AI — Model Analysis</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#f3f4f6; --panel3:#eceef2; --ink:#16181d; --ink2:#3a3f4a;
    --muted:#667085; --line:#e4e7ec; --line2:#d0d5dd;
    --accent:#4f46e5; --accent-soft:#eef0ff;
    --ok:#157347; --warn:#9a5b00; --stop:#b42318; --info:#175cd3;
    --ok-soft:#ecfdf3; --warn-soft:#fffaeb; --stop-soft:#fef3f2; --info-soft:#eff8ff;
    /* chart series - validated for CVD and contrast on this surface */
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --grid:#ececE8; --axis:#c9c9c3;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#111317; --panel:#181b21; --panel2:#1f232a; --panel3:#262b33; --ink:#eceef2; --ink2:#c8ccd4;
      --muted:#9aa1ad; --line:#2a2f38; --line2:#3a404b;
      --accent:#8b85ff; --accent-soft:#23234a;
      --ok:#5fd19a; --warn:#e0a33a; --stop:#ff8a80; --info:#7fb0ef;
      --ok-soft:#14261d; --warn-soft:#2a2110; --stop-soft:#2c1614; --info-soft:#132235;
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
      --grid:#2c2c33; --axis:#4a4a53;
      --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#111317; --panel:#181b21; --panel2:#1f232a; --panel3:#262b33; --ink:#eceef2; --ink2:#c8ccd4;
    --muted:#9aa1ad; --line:#2a2f38; --line2:#3a404b;
    --accent:#8b85ff; --accent-soft:#23234a;
    --ok:#5fd19a; --warn:#e0a33a; --stop:#ff8a80; --info:#7fb0ef;
    --ok-soft:#14261d; --warn-soft:#2a2110; --stop-soft:#2c1614; --info-soft:#132235;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --grid:#2c2c33; --axis:#4a4a53;
    --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 20px 90px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  a:focus-visible, button:focus-visible, .info-i:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  h1 { font-size:16px; margin:0; letter-spacing:-.01em; font-weight:700; }
  h2 { font-size:17px; margin:0 0 2px; letter-spacing:-.01em; }
  h3 { font-size:11.5px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:650; }
  .sub { color:var(--muted); font-size:13px; }

  /* ---- top bar ---- */
  .topbar { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); margin:0 -20px; padding:0 20px; }
  .topbar-in { max-width:1240px; margin:0 auto; }
  header.top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 0 8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark { width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff; display:flex;
                 align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:-.02em; }
  .brand .product { color:var(--muted); font-weight:600; font-size:14px; }
  .brand .sep { color:var(--line2); }
  #head-sub { font-size:12px; }
  nav { display:flex; gap:2px; flex-wrap:wrap; }
  nav a { padding:9px 12px 10px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent;
          margin-bottom:-1px; }
  nav a:hover { color:var(--ink); text-decoration:none; }
  nav a.on { color:var(--ink); border-bottom-color:var(--accent); }
  .subnav { display:flex; gap:6px; flex-wrap:wrap; margin:18px 0 2px; }
  .subnav a { font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:99px; border:1px solid var(--line);
              color:var(--muted); background:var(--panel); }
  .subnav a.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .subnav a:hover { text-decoration:none; color:var(--ink); }

  /* ---- generic building blocks ---- */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
          margin-top:14px; box-shadow:var(--shadow); }
  .card.flush { padding:0; overflow:hidden; }
  .grid { display:grid; gap:12px; }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .spread { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }

  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.04em;
          padding:2px 9px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; line-height:1.6; }
  .pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)}
  .pill.stop{color:var(--stop);background:var(--stop-soft)} .pill.mut{color:var(--muted)}
  .pill.info{color:var(--info);background:var(--info-soft)} .pill.acc{color:var(--accent);background:var(--accent-soft)}

  .metric { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 13px; }
  .metric .name { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; font-weight:600; }
  .metric .val { font-size:26px; font-weight:650; letter-spacing:-.02em; margin:5px 0 1px; font-variant-numeric:tabular-nums; }
  .metric .den { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .metric .src { font-size:11px; color:var(--muted); margin-top:7px; word-break:break-all; }
  .metric.flag { border-color:var(--warn); }
  .info-i { display:inline-flex; width:15px; height:15px; align-items:center; justify-content:center; flex:none;
            border-radius:50%; border:1px solid var(--muted); color:var(--muted); font-size:10px; font-weight:700;
            cursor:help; font-style:normal; }
  .heur { font-size:9.5px; font-weight:700; letter-spacing:.05em; color:var(--warn); border:1px solid currentColor;
          border-radius:4px; padding:0 4px; }
  .tag { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
         border:1px solid var(--line2); border-radius:5px; padding:1px 6px; white-space:nowrap; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
       font-weight:650; padding:9px 11px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel);
       white-space:nowrap; z-index:1; }
  td { padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:var(--panel2); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { max-height:640px; overflow:auto; }
  .hscroll { overflow-x:auto; }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }

  input, select, button, textarea { font:inherit; color:inherit; }
  input[type=text], input[type=search], select {
    background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:7px 10px; font-size:13px; }
  button { font-weight:600; font-size:13px; border:1px solid var(--line2); border-radius:8px; padding:7px 13px;
           background:var(--panel); cursor:pointer; }
  button:hover { background:var(--panel2); }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.primary:hover { filter:brightness(1.07); }
  button.ghost { background:transparent; }
  button:disabled { opacity:.45; cursor:default; }

  .banner { border-radius:10px; padding:11px 14px; font-size:13.5px; margin-top:14px; border:1px solid; display:flex; gap:9px; align-items:flex-start; }
  .banner.warn { color:var(--warn); background:var(--warn-soft); }
  .banner.stop { color:var(--stop); background:var(--stop-soft); }
  .banner.info { color:var(--info); background:var(--info-soft); }
  .banner b { font-weight:700; }
  .banner .body { color:var(--ink); }

  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; word-break:break-word; }

  .answer { white-space:pre-wrap; font-size:13.5px; background:var(--panel2); border:1px solid var(--line);
            border-radius:9px; padding:12px; max-height:430px; overflow:auto; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

  .tip { position:fixed; z-index:50; max-width:360px; background:var(--panel); color:var(--ink);
         border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:12.5px; line-height:1.5;
         box-shadow:0 8px 28px rgba(0,0,0,.18); pointer-events:none; display:none; }
  .tip h4 { margin:0 0 5px; font-size:13px; }
  .tip .lab { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-top:7px; }
  .empty { color:var(--muted); font-size:13.5px; padding:22px 4px; text-align:center; }
  .loading { color:var(--muted); font-size:13.5px; padding:48px 4px; text-align:center; }
  .loading::before { content:""; display:inline-block; width:14px; height:14px; margin-right:9px; vertical-align:-2px;
                     border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%;
                     animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:var(--stop); }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; padding:4px 0; }
  .chart { width:100%; }
  .chart text { font-size:10.5px; fill:var(--muted); }
  .chart .grid line { stroke:var(--grid); stroke-width:1; }
  .chart .axis { stroke:var(--axis); stroke-width:1; }
  .bar { fill:var(--series-1); }
  .up { color:var(--ok); } .down { color:var(--stop); } .flat { color:var(--muted); }

  /* ---- page heading ---- */
  .pagehead { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin:26px 0 4px; }
  .pagehead .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .pagehead h2 { font-size:26px; letter-spacing:-.025em; margin:4px 0 2px; line-height:1.15; }
  .pagehead .lede { color:var(--muted); font-size:13.5px; max-width:78ch; }

  /* ---- identity panel ---- */
  .identity { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; margin-top:16px; }
  .idcard { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 14px;
            box-shadow:var(--shadow); border-top:3px solid var(--ok); min-width:0; }
  .idcard.hist { border-top-color:var(--warn); }
  .idcard .label { font-size:10.5px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
                   display:flex; align-items:center; gap:8px; }
  .idcard .big { font-size:21px; font-weight:700; letter-spacing:-.02em; margin:6px 0 1px; overflow-wrap:anywhere; }
  .idcard .big.mono { font-size:18px; }
  .idcard .kv { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .idcard .kv dd.mono { font-size:12px; }
  .identity-more { margin-top:10px; }
  .identity-more > summary { font-size:12.5px; }

  /* ---- coverage line ---- */
  .covline { display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin-top:12px; padding:10px 16px;
             border:1px dashed var(--line2); border-radius:10px; font-size:13px; color:var(--ink2); background:var(--panel); }
  .covline b { font-variant-numeric:tabular-nums; }

  /* ---- analysis sections ---- */
  .jump { display:flex; gap:6px; flex-wrap:wrap; margin-top:18px; }
  .jump button { font-size:12px; padding:4px 10px; border-radius:99px; color:var(--muted); }
  .asec { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-top:18px;
          box-shadow:var(--shadow); overflow:hidden; }
  .asec-head { padding:16px 18px 12px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
               border-bottom:1px solid var(--line); }
  .asec-head h3 { font-size:17px; text-transform:none; letter-spacing:-.01em; color:var(--ink); margin:0; font-weight:700;
                  display:flex; align-items:center; gap:9px; }
  .asec-head .q { color:var(--ink2); font-size:13.5px; margin-top:3px; }
  .asec-head .why { color:var(--muted); font-size:12.5px; margin-top:6px; max-width:86ch; }
  .asec-head .count { font-size:12px; color:var(--muted); white-space:nowrap; text-align:right; }
  .asec-body { padding:14px 18px 16px; }
  .subgroup { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2);
              margin:16px 0 0; display:flex; align-items:center; gap:10px; }
  .subgroup::after { content:""; flex:1; height:1px; background:var(--line); }
  .subgroup:first-child { margin-top:2px; }
  .tiles { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); margin-top:12px; }
  .tile { background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:13px 14px; min-width:0;
          display:flex; flex-direction:column; }
  .tile .k { font-size:12px; color:var(--ink2); font-weight:650; display:flex; align-items:center; gap:6px;
             line-height:1.35; overflow-wrap:anywhere; }
  .tile .v { font-size:28px; font-weight:700; letter-spacing:-.025em; margin:6px 0 0; font-variant-numeric:tabular-nums;
             overflow-wrap:anywhere; line-height:1.15; }
  .tile .d { font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums; margin-top:2px; }
  .tile .def { font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.45;
               display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .f { font-size:11px; color:var(--muted); margin-top:6px; overflow-wrap:anywhere; }
  .tile.none { border-style:dashed; background:transparent; }
  .tile.none .v { font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0; margin-top:10px; }
  .mtable { margin-top:14px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .mtable td { padding:7px 11px; }
  .mtable tr.nmrow td { color:var(--muted); }
  .mtable .defcell { color:var(--muted); font-size:12px; }
  .state { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  .state.good{background:var(--ok)} .state.attention{background:var(--warn)} .state.poor{background:var(--stop)}
  .state.available{background:var(--info)} .state.informational{background:var(--muted)}
  .state.missing{background:transparent;border:1px solid var(--muted)} .state.inconsistent{background:var(--warn)}
  .affected { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .affected a { display:flex; gap:10px; align-items:baseline; padding:5px 2px; font-size:13px; color:var(--ink2); }
  .affected a:hover { color:var(--accent); text-decoration:none; }
  .affected .n { font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; color:var(--ink); }
  .affected .go { margin-left:auto; color:var(--accent); font-size:12px; white-space:nowrap; }

  /* ---- what needs attention ---- */
  .attn-group { margin-top:14px; }
  .attn-group:first-child { margin-top:0; }
  .attn-group .gt { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .attn { display:flex; align-items:center; gap:14px; padding:10px 13px; border:1px solid var(--line);
          border-radius:10px; margin-top:6px; background:var(--panel); cursor:pointer; text-align:left; width:100%; font-weight:400; }
  .attn:hover { background:var(--panel2); border-color:var(--line2); }
  .attn .n { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  .attn .of { font-size:11.5px; color:var(--muted); min-width:44px; font-variant-numeric:tabular-nums; }
  .attn .l { font-size:13.5px; flex:1; color:var(--ink); }
  .attn .d { font-size:12px; color:var(--muted); margin-top:1px; }
  .attn .go { font-size:12.5px; color:var(--accent); font-weight:600; white-space:nowrap; }
  .layer { display:flex; align-items:center; gap:10px; margin:6px 0; cursor:pointer; }
  .layer:hover .bar { filter:brightness(1.12); }
  .layer .name { flex:0 0 170px; font-size:13px; }
  .layer .track { flex:1; background:var(--panel2); border-radius:5px; height:16px; overflow:hidden; }
  .layer .bar { height:100%; border-radius:0 4px 4px 0; }
  .layer .n { flex:0 0 92px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--muted); }

  /* ---- question analysis ---- */
  .qtools { padding:14px 18px; border-bottom:1px solid var(--line); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:99px; border:1px solid var(--line2);
          background:var(--panel); cursor:pointer; color:var(--ink); }
  .chip:hover { background:var(--panel2); }
  .chip .c { color:var(--muted); font-weight:500; margin-left:5px; font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip[aria-pressed="true"] .c { color:#fff; opacity:.85; }
  .qmeta { font-size:12.5px; color:var(--muted); margin-top:10px; }
  .qmeta b { color:var(--ink); }
  .rf { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-weight:700; }
  .rf .arrow { color:var(--muted); font-weight:400; }
  .mk { display:inline-flex; width:20px; height:20px; border-radius:6px; align-items:center; justify-content:center;
        font-size:12px; font-weight:800; }
  .mk.y { color:var(--ok); background:var(--ok-soft); } .mk.n { color:var(--stop); background:var(--stop-soft); }
  .mk.u { color:var(--muted); background:var(--panel2); font-weight:600; }
  .qtext { max-width:46ch; }
  .yes { color:var(--ok); font-weight:600; } .no { color:var(--stop); font-weight:600; } .nm { color:var(--muted); }

  /* ---- question forensics ---- */
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:12px; }
  .step { flex:1 1 150px; min-width:140px; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
          background:var(--panel2); position:relative; }
  .step .sn { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .step .sv { font-size:14px; font-weight:650; margin-top:4px; }
  .step .ss { font-size:11.5px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
  .step.ok { border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:var(--ok-soft); }
  .step.bad { border-color:color-mix(in srgb, var(--stop) 45%, var(--line)); background:var(--stop-soft); }
  .step.chg { border-color:color-mix(in srgb, var(--info) 45%, var(--line)); background:var(--info-soft); }
  .flow .arr { display:flex; align-items:center; padding:0 6px; color:var(--muted); font-size:16px; }
  .trajectory { font-size:16px; font-weight:650; letter-spacing:-.01em; }

  /* ---- home: the summary ---- */
  .home-hero { margin-top:30px; display:flex; justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap;
               padding-bottom:22px; border-bottom:1px solid var(--line); }
  .home-hero .eyebrow { font-size:11px; font-weight:750; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .home-hero .model { font-size:40px; font-weight:750; letter-spacing:-.035em; line-height:1.05; margin:8px 0 4px; }
  .home-hero .org { color:var(--muted); font-size:14px; }
  .home-hero .evalline { margin-top:14px; display:flex; gap:8px 18px; flex-wrap:wrap; font-size:13.5px; color:var(--ink2); }
  .home-hero .evalline b { color:var(--ink); font-weight:650; }
  .home-hero .actions { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .textlink { font-size:13.5px; font-weight:600; color:var(--accent); white-space:nowrap; }
  .home-sec { margin-top:34px; }
  .home-sec-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .home-sec-head h3 { font-size:12px; letter-spacing:.12em; color:var(--ink2); margin:0; }
  .kpis { display:grid; gap:16px; grid-template-columns:repeat(4, minmax(0,1fr)); }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 20px 16px;
         box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:228px; min-width:0; }
  .kpi .lab { font-size:14px; font-weight:650; color:var(--ink2); display:flex; align-items:center; gap:7px; }
  .kpi .pct { font-size:46px; font-weight:750; letter-spacing:-.04em; line-height:1; margin:16px 0 8px;
              font-variant-numeric:tabular-nums; color:var(--ink); }
  .kpi .frac { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:650; }
  .kpi .say { font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .kpi .foot { margin-top:auto; padding-top:14px; font-size:13px; }
  .kpi.none { border-style:dashed; box-shadow:none; background:transparent; }
  .kpi.none .pct { font-size:22px; letter-spacing:-.01em; color:var(--muted); margin:22px 0 6px; }
  .duo { display:grid; gap:16px; grid-template-columns:repeat(2, minmax(0,1fr)); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px 18px;
           box-shadow:var(--shadow); display:flex; flex-direction:column; min-width:0; }
  .panel h3 { font-size:12px; letter-spacing:.12em; color:var(--ink2); margin:0 0 4px; }
  .panel .lead { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .panel .foot { margin-top:auto; padding-top:14px; }
  .alist { list-style:none; margin:0; padding:0; }
  .alist li { border-top:1px solid var(--line); }
  .alist li:first-child { border-top:0; }
  .alist a { display:flex; align-items:baseline; gap:12px; padding:11px 2px; color:var(--ink); }
  .alist a:hover { text-decoration:none; background:var(--panel2); }
  .alist .n { font-size:22px; font-weight:750; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; letter-spacing:-.02em; }
  .alist .of { font-size:12px; color:var(--muted); min-width:36px; font-variant-numeric:tabular-nums; }
  .alist .t { flex:1; font-size:14px; }
  .alist .go { color:var(--accent); font-weight:700; }
  .flist { list-style:none; margin:0; padding:0; }
  .flist li { display:flex; gap:12px; align-items:baseline; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .flist li:first-child { border-top:0; }
  .flist li .t { flex:1; }
  .flist li.nm .t { color:var(--muted); }
  .flist li a { font-size:12.5px; font-weight:600; white-space:nowrap; }
  .times { display:flex; gap:34px; flex-wrap:wrap; margin:6px 0 4px; }
  .times .v { font-size:32px; font-weight:750; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .times .k { font-size:13px; color:var(--ink2); font-weight:600; margin-top:4px; }
  .home-foot { margin-top:30px; font-size:12.5px; color:var(--muted); text-align:center; }
  @media (max-width:1000px) { .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); } #head-sub { display:none; } }
  @media (max-width:760px) { .duo { grid-template-columns:1fr; } .home-hero .actions { align-items:flex-start; } }
  @media (max-width:520px) { .kpis { grid-template-columns:1fr; } .kpi { min-height:0; } .home-hero .model { font-size:32px; }
                             .kpi .pct { font-size:40px; } }

  /* ---- older views kept from Phase 3 ---- */
  .hero { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-top:16px; }
  .hero .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .hero h2 { font-size:25px; margin:6px 0 2px; letter-spacing:-.02em; line-height:1.2; }
  .hero .ident { color:var(--muted); font-size:14px; }
  .hero .facts { display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; padding-top:15px; border-top:1px solid var(--line); }
  .fact .k { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .fact .v { font-size:14.5px; font-weight:600; margin-top:3px; }
  .section-head { margin:26px 0 4px; }
  .section-head h3 { font-size:16px; text-transform:none; letter-spacing:-.01em; color:var(--ink); margin:0; font-weight:650; }
  .section-head .why { color:var(--muted); font-size:13.5px; margin:5px 0 0; max-width:74ch; }
  .metric .val.nm { font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0; margin:9px 0 3px; }
  .coverage { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:12px; }
  .coverage .cell { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--panel2); }
  .coverage .cell .k { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .coverage .cell .v { font-size:20px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
  .coverage .cell .s { font-size:12px; color:var(--muted); }
  .idgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:4px 22px; margin-top:6px; }
  .idgrid .kv { font-size:12.5px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (max-width:720px) {
    .wrap { padding:0 16px 70px; }
    .topbar { margin:0 -16px; padding:0 16px; }
    .pagehead h2 { font-size:22px; }
    .identity { grid-template-columns:1fr; }
    .tiles { grid-template-columns:1fr 1fr; }
    .tile .v { font-size:23px; }
    .layer .name { flex:0 0 100px; }
    nav a { padding:8px 9px 9px; font-size:12.5px; }
    .brand .product, .brand .sep, #head-sub { display:none; }
    .flow .arr { display:none; }
    .step { flex:1 1 100%; margin-top:6px; }
    .hero .facts { gap:16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="topbar-in">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">R</div>
        <h1>Regulus AI</h1>
        <span class="sep" aria-hidden="true">/</span>
        <span class="product">Model Analysis</span>
      </div>
      <span style="flex:1"></span>
      <span class="sub" id="head-sub">loading…</span>
      <button id="theme" class="mono ghost" title="Toggle light / dark theme" aria-label="Toggle theme">◐</button>
      <button id="refresh" title="Re-read the artifacts on disk">Rescan artifacts</button>
    </header>
    <nav id="nav" aria-label="Primary"></nav>
  </div></div>
  <div id="alerts"></div>
  <main id="view"><div class="loading">Loading…</div></main>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ state */
const S = { defs:{}, defsByKey:{}, experiments:[], current:null, fingerprint:null, cache:{} };
// Six destinations. Model analysis is home; everything historical lives
// under Experiments, everything about the machinery under Diagnostics.
const TABS = [
  ["analysis",    "Model analysis"],
  ["questions",   "Questions"],
  ["experiments", "Experiments"],
  ["training",    "Training"],
  ["diagnostics", "Diagnostics"],
  ["metrics",     "Definitions"],
];
// routes that are pages inside a primary destination
const PARENT = { overview:"analysis", question:"questions", history:"experiments", compare:"experiments",
                 models:"experiments", review:"diagnostics" };
const SUBNAV = {
  experiments: [["experiments", "All experiments"], ["history", "History of the current line"],
                ["compare", "Compare"], ["models", "Models"]],
  diagnostics: [["diagnostics", "System"], ["review", "Benchmark key review"]],
};
// The order the question filters are offered in. Keys and labels are the
// backend's (regulus.dashboard.observatory); this is only their order.
const PRIMARY_FILTERS = ["incorrect", "correct", "retrieval_issue", "validation_failure", "repaired",
                         "citation_issue", "refused", "slow", "not_measured"];

/* -------------------------------------------------------------- utilities */
const $ = (sel, el=document) => el.querySelector(sel);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, options) {
  const res = await fetch(path, options);
  let body;
  try { body = await res.json(); }
  catch { throw new Error(`${path}: the server did not return JSON (HTTP ${res.status})`); }
  if (!res.ok) throw new Error(body.error || `${path}: HTTP ${res.status}`);
  return body;
}
async function cached(path) {
  if (!(path in S.cache)) S.cache[path] = api(path);
  return S.cache[path];
}

/* ---------------------------------------------------------------- display */
// A metric the evaluation did not produce is "Not measured": never "—", never 0.
const NOT_MEASURED = "Not measured";
function isMeasured(m) {
  return m != null && m.value !== null && m.value !== undefined && m.status !== "missing";
}
function fmtValue(m) {
  if (!isMeasured(m)) return NOT_MEASURED;
  const v = m.value;
  if (m.unit === "ratio") return (v * 100).toFixed(v * 100 >= 99.95 || v === 0 ? 0 : 1) + "%";
  if (m.unit === "seconds") return v >= 120 ? `${Math.floor(v/60)}m ${Math.round(v%60)}s`
                                  : v >= 1 ? `${v.toFixed(v >= 10 ? 1 : 2)} s` : `${(v*1000).toFixed(0)} ms`;
  if (m.unit === "score") return v.toLocaleString(undefined, {maximumFractionDigits:3});
  if (m.unit === "tokens" || m.unit === "count")
    return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits:3});
  return String(v);
}
// A bare ratio, formatted exactly as fmtValue formats a ratio metric, for the
// places that hold a number rather than a MetricResult (a gate's measurement).
function ratioText(v) {
  if (v === null || v === undefined) return "\u2013";
  return (v * 100).toFixed(v * 100 >= 99.95 || v === 0 ? 0 : 1) + "%";
}
function fmtNumber(v, digits=4) {
  if (v === null || v === undefined) return "—";
  return typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(digits)) : String(v);
}
function fmtDate(s) {
  if (!s) return "no timestamp";
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString(undefined, {dateStyle:"medium", timeStyle:"short"});
}
function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return "not recorded";
  const s = Math.round(seconds), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${m} m ${s % 60} s` : m ? `${m} m ${s % 60} s` : `${s} s`;
}
function fmtMs(ms) {
  return typeof ms === "number" ? (ms >= 1000 ? `${(ms/1000).toFixed(1)} s` : `${ms.toFixed(0)} ms`) : "not recorded";
}
const short = (s, n=12) => s ? String(s).slice(0, n) : "—";
const DIRECTION_MARK = { higher_is_better:"↑ higher is better", lower_is_better:"↓ lower is better", informational:"— informational" };

const STATUS_STYLE = {
  CURRENT:     ["ok",   "measures the model the pipeline runs today"],
  COMPLETE:    ["info", "the artifacts are whole"],
  HISTORICAL:  ["mut",  "measured something other than the current model"],
  STALE:       ["warn", "the configured weights, but superseded by a later compatible run or measured under a different pipeline"],
  INCOMPLETE:  ["warn", "the run did not finish"],
  FAILED:      ["stop", "the run failed"],
  UNSUPPORTED_SCHEMA: ["stop", "no adapter understands this artifact"],
};
function statusPill(status, reason) {
  const [cls] = STATUS_STYLE[status] || ["mut", ""];
  return el("span", {class:`pill ${cls}`, title: reason || (STATUS_STYLE[status]||[])[1] || ""}, status);
}
function currentEvaluationIds() {
  return ((S.current && S.current.current_evaluations) || []).map(e => e.experiment_id);
}

/* ------------------------------------------------------------- the ⓘ card */
function infoIcon(key) {
  const def = S.defsByKey[key];
  if (!def) return null;
  const node = el("i", {class:"info-i", "data-key":key, "aria-label":`About ${def.name}`}, "i");
  node.addEventListener("mouseenter", (e) => showTip(e, def));
  node.addEventListener("mousemove", positionTip);
  node.addEventListener("mouseleave", hideTip);
  node.addEventListener("focus", (e) => showTip(e, def));
  node.addEventListener("blur", hideTip);
  node.setAttribute("tabindex", "0");
  return node;
}
function showTip(e, def) {
  const tip = $("#tip");
  tip.innerHTML = "";
  tip.appendChild(el("h4", {}, def.name, def.heuristic ? " " : null,
    def.heuristic ? el("span", {class:"heur"}, "HEURISTIC") : null));
  tip.appendChild(el("div", {}, def.definition));
  tip.appendChild(el("div", {class:"lab"}, "How it is calculated"));
  tip.appendChild(el("div", {class:"mono"}, def.calculation));
  tip.appendChild(el("div", {class:"lab"}, "Direction"));
  tip.appendChild(el("div", {}, DIRECTION_MARK[def.direction] || def.direction));
  if (def.caveats) {
    tip.appendChild(el("div", {class:"lab"}, "What it does not prove"));
    tip.appendChild(el("div", {}, def.caveats));
  }
  if (def.source_hint) {
    tip.appendChild(el("div", {class:"lab"}, "Source"));
    tip.appendChild(el("div", {class:"mono"}, def.source_hint));
  }
  tip.appendChild(el("div", {class:"lab"}, "Unit"));
  tip.appendChild(el("div", {}, def.unit === "ratio" ? "ratio (numerator / denominator, shown as %)" : def.unit));
  tip.style.display = "block";
  positionTip(e);
}
function positionTip(e) {
  const tip = $("#tip"), pad = 14;
  const x = Math.min(e.clientX + pad, window.innerWidth - tip.offsetWidth - pad);
  const y = Math.min(e.clientY + pad, window.innerHeight - tip.offsetHeight - pad);
  tip.style.left = Math.max(pad, x) + "px";
  tip.style.top = Math.max(pad, y) + "px";
}
function hideTip() { $("#tip").style.display = "none"; }

/* ------------------------------------------------------------ metric card */
function metricCard(m, provenance) {
  const def = S.defsByKey[m.key] || {};
  const flagged = m.status === "inconsistent" || m.status === "missing";
  return el("div", {class:`metric${flagged ? " flag" : ""}`},
    el("div", {class:"name"}, def.name || m.display_name, infoIcon(m.key),
      def.heuristic ? el("span", {class:"heur"}, "HEURISTIC") : null),
    el("div", {class:`val${isMeasured(m) ? "" : " nm"}`}, fmtValue(m)),
    el("div", {class:"den"},
      m.sample_note ? m.sample_note : (isMeasured(m) ? " " : (m.note || "not produced by this evaluation"))),
    m.recomputed_from ? el("div", {class:"src"}, "recomputed from " + m.recomputed_from) : null,
    m.status === "inconsistent"
      ? el("div", {class:"src err"}, "⚠ " + m.note)
      : null,
    m.note && m.status !== "inconsistent" ? el("div", {class:"src"}, m.note) : null,
    el("div", {class:"src"}, (DIRECTION_MARK[m.direction] || "") + (m.source ? " · " + m.source : "")),
    provenance ? el("div", {class:"src"}, provenance) : null,
  );
}

/* --------------------------------------------------------- provenance line */
function provenanceOf(exp) {
  const bits = [
    `run ${exp.experiment_id}`,
    exp.model ? exp.model.label : "model unknown",
    exp.benchmark ? exp.benchmark.label : null,
    exp.benchmark && exp.benchmark.sha256 ? `sha ${exp.benchmark.sha256.slice(0,12)}` : null,
    fmtDate(exp.completed_at),
  ].filter(Boolean);
  return bits.join(" · ");
}
function identityCard(exp, run) {
  return el("div", {class:"card"},
    el("div", {class:"spread"},
      el("div", {},
        el("h2", {}, exp.name),
        el("div", {class:"sub mono"}, exp.path)),
      el("div", {class:"row"}, statusPill(exp.status, exp.status_reason))),
    exp.status_reason ? el("div", {class:"sub", style:"margin-top:8px"}, exp.status_reason) : null,
    el("dl", {class:"kv", style:"margin-top:12px"},
      el("dt", {}, "Model"), el("dd", {}, exp.model.label, " ", el("span", {class:"mono sub"}, exp.model.key)),
      exp.model.adapter_path ? el("dt", {}, "Adapter path") : null,
      exp.model.adapter_path ? el("dd", {class:"mono"}, exp.model.adapter_path) : null,
      el("dt", {}, "Benchmark"),
      el("dd", {}, exp.benchmark ? `${exp.benchmark.label} · ${exp.benchmark.key}` : "—"),
      el("dt", {}, "Run id"), el("dd", {class:"mono"}, exp.experiment_id),
      el("dt", {}, "Completed"), el("dd", {}, fmtDate(exp.completed_at)),
      el("dt", {}, "Schema"), el("dd", {class:"mono"}, (run && run.schema) || "—"),
      el("dt", {}, "Source files"),
      el("dd", {class:"mono"}, (exp.source_artifacts || []).join(", ") || "—"),
    ),
    (exp.problems || []).length ? el("details", {style:"margin-top:10px"},
      el("summary", {}, `${exp.problems.length} thing(s) this run does not tell us`),
      el("ul", {}, exp.problems.map(p => el("li", {style:"margin:6px 0;font-size:13px"}, p)))) : null,
    exp.configuration && Object.keys(exp.configuration).length ? el("details", {},
      el("summary", {}, "Configuration"),
      el("pre", {class:"mono", style:"white-space:pre-wrap;font-size:11.5px"},
        JSON.stringify(exp.configuration, null, 2))) : null,
  );
}
function subnav(group, active) {
  const items = SUBNAV[group];
  if (!items) return null;
  return el("div", {class:"subnav", role:"navigation", "aria-label":"Section"},
    items.map(([route, label]) => el("a", {href:`#/${route}`, class: route === active ? "on" : null,
      "aria-current": route === active ? "page" : null}, label)));
}

/* ------------------------------------------------------------- SVG charts */
function lineChart(series, opts={}) {
  // series: [{name, color, points:[{x,y}]}]  - one axis only, by design
  const W = opts.width || 720, H = opts.height || 260;
  const P = {t:14, r:16, b:30, l:52};
  const all = series.flatMap(s => s.points);
  if (!all.length) return el("div", {class:"empty"}, "no points recorded");
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  if (opts.zeroFloor && y0 < 0) y0 = 0;
  const sx = v => P.l + (x1 === x0 ? 0 : (v - x0) / (x1 - x0)) * (W - P.l - P.r);
  const sy = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);

  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", opts.label || "chart");
  const mk = (tag, attrs) => { const n = document.createElementNS(ns, tag);
    for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };

  const g = mk("g", {class:"grid"});
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    g.appendChild(mk("line", {x1:P.l, x2:W-P.r, y1:y, y2:y}));
    const t = mk("text", {x:P.l-7, y:y+3.5, "text-anchor":"end"});
    t.textContent = opts.fmtY ? opts.fmtY(v) : (Math.abs(v) < 0.01 ? v.toExponential(1) : v.toFixed(2));
    svg.appendChild(t);
  }
  svg.appendChild(g);
  svg.appendChild(mk("line", {class:"axis", x1:P.l, x2:W-P.r, y1:sy(y0), y2:sy(y0)}));
  for (let i = 0; i <= 4; i++) {
    const v = x0 + (x1 - x0) * i / 4;
    const t = mk("text", {x:sx(v), y:H-10, "text-anchor":"middle"});
    t.textContent = opts.fmtX ? opts.fmtX(v) : Math.round(v);
    svg.appendChild(t);
  }
  series.forEach((s) => {
    if (!s.points.length) return;
    const d = s.points.map((p,i) => `${i?"L":"M"}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
    svg.appendChild(mk("path", {d, fill:"none", stroke:s.color, "stroke-width":2,
                                "stroke-linejoin":"round", "stroke-linecap":"round"}));
    s.points.forEach(p => {
      svg.appendChild(mk("circle", {cx:sx(p.x), cy:sy(p.y), r:3.4, fill:s.color,
                                    stroke:"var(--panel)", "stroke-width":2}));
    });
    // direct label at the last point, so identity is never colour alone
    const last = s.points[s.points.length-1];
    const t = mk("text", {x:Math.min(sx(last.x)+7, W-P.r), y:sy(last.y)-7, fill:s.color, "font-weight":"600"});
    t.textContent = s.name;
    svg.appendChild(t);
  });

  (opts.markers||[]).forEach(mrk => {
    svg.appendChild(mk("line", {x1:sx(mrk.x), x2:sx(mrk.x), y1:P.t, y2:H-P.b,
                                stroke:"var(--accent)", "stroke-width":1.5, "stroke-dasharray":"3 3"}));
    const t = mk("text", {x:sx(mrk.x)+4, y:P.t+10, fill:"var(--accent)"});
    t.textContent = mrk.label; svg.appendChild(t);
  });

  // hover crosshair + tooltip
  const cross = mk("line", {x1:0,x2:0,y1:P.t,y2:H-P.b, stroke:"var(--axis)", "stroke-width":1, opacity:0});
  svg.appendChild(cross);
  const hit = mk("rect", {x:P.l, y:P.t, width:W-P.l-P.r, height:H-P.t-P.b, fill:"transparent"});
  svg.appendChild(hit);
  hit.addEventListener("mousemove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) / box.width * W;
    const xv = x0 + (px - P.l) / (W - P.l - P.r) * (x1 - x0);
    cross.setAttribute("x1", sx(xv)); cross.setAttribute("x2", sx(xv)); cross.setAttribute("opacity", 1);
    const tip = $("#tip"); tip.innerHTML = "";
    tip.appendChild(el("h4", {}, `${opts.xName || "step"} ${Math.round(xv)}`));
    series.forEach(s => {
      if (!s.points.length) return;
      const near = s.points.reduce((a,b) => Math.abs(b.x-xv) < Math.abs(a.x-xv) ? b : a);
      tip.appendChild(el("div", {},
        el("span", {class:"swatch", style:`background:${s.color}`}), `${s.name}: `,
        el("b", {}, opts.fmtY ? opts.fmtY(near.y) : fmtNumber(near.y, 4)),
        el("span", {class:"sub"}, ` (at ${opts.xName||"step"} ${near.x})`)));
    });
    tip.style.display = "block"; positionTip(e);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  return svg;
}

function barChart(rows, opts={}) {
  // rows: [{label, value, color?, note?}] - horizontal bars, one series
  if (!rows.length) return el("div", {class:"empty"}, "nothing to show");
  const max = Math.max(...rows.map(r => Math.abs(r.value)), opts.max || 0) || 1;
  return el("div", {},
    rows.map(r => el("div", {class:"row", style:"gap:10px;margin:5px 0;align-items:center"},
      el("div", {style:"flex:0 0 190px;font-size:12.5px", title:r.label}, r.label),
      el("div", {style:"flex:1;background:var(--panel2);border-radius:5px;height:17px;position:relative;overflow:hidden"},
        el("div", {style:`width:${Math.max(1.5, Math.abs(r.value)/max*100)}%;height:100%;`
                        + `background:${r.color || "var(--series-1)"};border-radius:0 4px 4px 0`})),
      el("div", {class:"num mono", style:"flex:0 0 105px"}, r.display ?? fmtNumber(r.value)),
      r.note ? el("div", {class:"sub", style:"flex:0 0 auto"}, r.note) : null)));
}

/* ======================================================= MODEL ANALYSIS */
// One renderer for the current model (home) and for any evaluation opened
// explicitly (#/experiment/<id>). The backend says whether the evaluation is
// the current model's (payload.is_current); this page never decides it.

const V = {};

/* The home page: the current model in a few measurements, in plain English.
   Which measurements, their names and the sentence under each come from the
   backend (payload.summary); this page only lays them out. */
V.analysis = async () => {
  const view = $("#view");
  const h = await api("/api/model-health/current");
  view.innerHTML = "";
  if (h.state === "not_evaluated") { renderNotEvaluated(view, h); return renderAcceptance(view); }
  renderSummary(view, h);
  return renderAcceptance(view);
};

// the full record of the current evaluation (the Phase 3 route)
V.overview = async () => {
  const view = $("#view");
  const h = await api("/api/model-health/current");
  view.innerHTML = "";
  if (h.state === "not_evaluated") { renderNotEvaluated(view, h); return renderAcceptance(view); }
  await renderAnalysis(view, h);
  return renderAcceptance(view);
};

V.experiment = async (id, query = {}) => {
  const view = $("#view");
  const p = await api(`/api/evaluation/experiments/${encodeURIComponent(id)}/analysis`);
  view.innerHTML = "";
  const anchors = await renderAnalysis(view, p);
  const target = query.section && anchors[query.section];
  if (target && target.scrollIntoView) setTimeout(() => target.scrollIntoView({block:"start"}), 0);
};

function kpiCard(c, details, questions) {
  if (!c.measured) {
    return el("div", {class:"kpi none"},

      el("div", {class:"pct"}, NOT_MEASURED),

async function renderAnalysis(view, p) {
  const ev = p.evaluation, id = ev.experiment_id;
  const sectionTitle = Object.fromEntries((p.sections || []).map(s => [s.key, s.title]));

  // ---- not the current model: say so before anything else
  if (!p.is_current) {
    const cur = p.current_evaluation;
    view.appendChild(el("div", {class:"banner warn"}, el("b", {}, "⚠"),
      el("div", {class:"body"},
        el("b", {}, `Historical experiment (${ev.status}). `), p.note || "",
        ev.status_reason ? el("div", {class:"sub", style:"margin-top:5px"}, "Freshness engine: ", ev.status_reason) : null,
        el("div", {style:"margin-top:7px"}, cur
          ? el("a", {href:"#/analysis"}, `Go to the current model's analysis (${cur.name}) →`)
          : el("span", {class:"sub"}, "The configured model has no current evaluation.")))));
  }

  // ---- page heading
  view.appendChild(el("div", {class:"pagehead"},
    el("div", {},
      el("div", {class:"eyebrow"}, p.is_current ? "Current model" : "Historical experiment"),
      el("h2", {}, "Experiment details"),
      el("div", {class:"lede"},
        `The full record of evaluation ${ev.name}: identity, every measurement, what needs attention and every `
        + "question. Missing measurements are shown as Not measured, never as zero. Nothing here is a score or a verdict.")),
    el("div", {class:"row"},
      p.is_current ? el("a", {href:"#/analysis"}, el("button", {}, "← Summary")) : null,
      el("a", {href:`#/compare?ids=${encodeURIComponent(id)}`}, el("button", {}, "Compare with another experiment")),
      el("a", {href:"#/experiments"}, el("button", {class:"ghost"}, "Previous experiments")))));

  // ---- 1. identity: what is being analysed
  view.appendChild(identityPanel(p));
  if (p.coverage) view.appendChild(coverageLine(p.coverage));

  if (p.other_current_evaluations && p.other_current_evaluations.length) {
    view.appendChild(el("div", {class:"banner info"}, el("b", {}, "i"),
      el("div", {class:"body"}, p.other_current_note,
        el("div", {style:"margin-top:6px"}, p.other_current_evaluations.map(o =>
          el("div", {}, el("a", {href:`#/experiment/${o.experiment_id}`}, o.name),
            el("span", {class:"sub"}, ` — ${o.benchmark} · ${fmtDate(o.completed_at)}`)))))));
  }

  // ---- in-page navigation; byKey lets a summary link open a section directly
  const anchors = {}, byKey = {};

  view.appendChild(jump);

  // ---- 2. the measurement groups
  const bySection = {};
  for (const item of (p.attention && p.attention.items) || []) {

  }
  for (const section of p.sections || []) {

  // ---- 3. what needs attention

  // ---- 4. question analysis, filtered by the server, in place
  const qsec = el("section", {class:"asec"},
    el("div", {class:"asec-head"},
      el("div", {},
        el("h3", {}, "Question analysis"),
        el("div", {class:"q"}, "Every question in this evaluation, from aggregate to record."),
        el("div", {class:"why"}, "Filters run on the server against the question records. Click a question for its "
          + "forensic view: retrieval, evidence, raw answer, validation, repair and final answer.")),
      el("div", {class:"count"}, el("a", {href:`#/questions/${encodeURIComponent(id)}`}, "Open in Questions →"))));
  const qhost = el("div");
  qsec.appendChild(qhost);
  anchors["Question analysis"] = byKey.questions = qsec;
  view.appendChild(qsec);
  await questionAnalysis(qhost, id, {}, null);

  for (const [label, node] of Object.entries(anchors)) {
    jump.appendChild(el("button", {onclick: () => { if (node.scrollIntoView) node.scrollIntoView({behavior:"smooth", block:"start"}); }}, label));
  }

  // ---- 5. provenance footer
  const tr = p.training || {};
  view.appendChild(el("div", {class:"card", style:"margin-top:22px"},
    el("h3", {}, "How this model was produced"),
    el("div", {}, tr.trained
      ? [`Fine-tuned adapter ${tr.adapter}`, tr.checkpoint ? `, checkpoint ${tr.checkpoint}` : "",
         tr.training_run ? ", from training run " : ""].join("")
      : tr.note),
    tr.training_run ? el("a", {href:`#/training/${tr.training_run.experiment_id}`}, tr.training_run.name) : null,
    el("div", {class:"sub", style:"margin-top:8px"}, tr.trained ? tr.note : ""),
    el("div", {class:"row", style:"margin-top:12px"},
      el("a", {href:"#/history"}, el("button", {}, "History of the current line →")),
      el("a", {href:"#/experiments"}, el("button", {}, "All experiments →")))));
  if (ev.problems && ev.problems.length) {
    view.appendChild(el("details", {class:"card"},
      el("summary", {}, `${ev.problems.length} thing(s) this evaluation does not tell us`),
      el("ul", {}, ev.problems.map(x => el("li", {style:"margin:6px 0;font-size:13px"}, x)))));
  }
  return byKey;
}

/* One measurement group: headline tiles, then every other metric of the group
   in a table, then the defined metrics this evaluation did not produce. */
function analysisSection(section, attention, id) {
  const measured = section.metrics.filter(m => m.measured).length;
  const notMeasured = section.not_measured.length + section.metrics.length - measured;
  const groups = section.subgroups && section.subgroups.length ? section.subgroups : [null];
  const body = el("div", {class:"asec-body"});
  for (const group of groups) {
    const inGroup = (m) => group === null || m.subgroup === group;
    const metrics = section.metrics.filter(inGroup), missing = section.not_measured.filter(inGroup);
    if (!metrics.length && !missing.length) continue;
    if (group) body.appendChild(el("div", {class:"subgroup"}, group));
    const headline = metrics.filter(m => m.headline), rest = metrics.filter(m => !m.headline);
    if (headline.length) body.appendChild(el("div", {class:"tiles"}, headline.map(analysisTile)));
    if (rest.length || missing.length) body.appendChild(metricTable(rest, missing));
  }
  if (attention.length) {
    body.appendChild(el("div", {class:"affected"},
      el("h3", {style:"margin:0 0 4px"}, "Affected questions"),
      attention.map(item => el("a", {href:`#/questions/${encodeURIComponent(id)}?filter=${encodeURIComponent(item.filter)}`},
        el("span", {class:"n"}, `${item.count} / ${item.denominator}`),
        el("span", {}, item.label),
        el("span", {class:"go"}, "View questions →")))));
  }
  return el("section", {class:"asec"},
    el("div", {class:"asec-head"},
      el("div", {},
        el("h3", {}, section.title, section.key === "performance" ? el("span", {class:"tag"}, "runtime-dependent") : null),
        el("div", {class:"q"}, section.question),
        el("div", {class:"why"}, section.explanation)),
      el("div", {class:"count"}, `${measured} measured`, el("br"), `${notMeasured} not measured`)),
    body);
}

function analysisTile(m) {
  const def = S.defsByKey[m.key] || {};
  const st = m.state || {state:"available"};
  if (!isMeasured(m) || st.state === "missing") {
    return el("div", {class:"tile none"},
      el("div", {class:"k"}, el("span", {class:"state missing"}), def.name || m.display_name, infoIcon(m.key)),
      el("div", {class:"v"}, NOT_MEASURED),
      el("div", {class:"f"}, m.note || st.reason || "not measured by this evaluation"));
  }
  return el("div", {class:"tile"},
    el("div", {class:"k"}, def.name || m.display_name, infoIcon(m.key),
      m.heuristic ? el("span", {class:"heur"}, "HEURISTIC") : null),
    el("div", {class:"v"}, fmtValue(m)),
    el("div", {class:"d"}, m.sample_note ? m.sample_note : " "),
    def.definition ? el("div", {class:"def", title:def.definition}, def.definition) : null,
    m.recomputed_from ? el("div", {class:"f"}, "✓ recomputed from " + m.recomputed_from) : null,
    st.state === "inconsistent" ? el("div", {class:"f err"}, "⚠ " + st.reason) : null);
}

function metricTable(rest, missing) {
  const row = (m, measured) => {
    const def = S.defsByKey[m.key] || {};
    return el("tr", {class: measured ? null : "nmrow"},
      el("td", {}, def.name || m.display_name, " ", infoIcon(m.key),
        m.heuristic ? el("span", {class:"heur", style:"margin-left:5px"}, "HEURISTIC") : null),
      el("td", {class:"num mono"}, measured ? fmtValue(m) : NOT_MEASURED),
      el("td", {class:"num mono sub"}, measured && m.sample_note ? m.sample_note : ""),
      el("td", {class:"defcell"}, measured ? (def.definition || "") : (m.note || m.reason || "not measured by this evaluation")));
  };
  return el("div", {class:"mtable hscroll"}, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Other measurements"), el("th", {class:"num"}, "Value"),
      el("th", {class:"num"}, "Sample"), el("th", {}, "What it measures"))),
    el("tbody", {}, rest.map(m => row(m, isMeasured(m))), missing.map(m => row(m, false)))));
}

/* What needs attention: factual counts from the question records, each a
   link to exactly those questions. Grouped by section, never ranked. */
function attentionSection(p, id, sectionTitle) {
  const attn = p.attention, fb = p.failure_breakdown;
  const body = el("div", {class:"asec-body"});
  const items = (attn && attn.items) || [];
  if (!items.length) {
    body.appendChild(el("div", {class:"row"},
      el("span", {class:"pill mut"}, "nothing flagged"),
      el("span", {class:"sub"}, attn && attn.note ? attn.note
        : `No question in this evaluation matched an attention check (${attn ? attn.total_questions : 0} questions).`)));
  } else {
    const order = [...(p.sections || []).map(s => s.key), null];
    for (const key of order) {
      const group = items.filter(i => (i.section || null) === key);
      if (!group.length) continue;
      body.appendChild(el("div", {class:"attn-group"},
        el("div", {class:"gt"}, key ? sectionTitle[key] || key : "Records"),
        group.map(item => el("button", {class:"attn", title:item.description || "",
            onclick: () => { if (item.filter) location.hash = `#/questions/${encodeURIComponent(id)}?filter=${encodeURIComponent(item.filter)}`; }},
          el("div", {class:"n"}, item.count),
          el("div", {class:"of"}, item.denominator ? `of ${item.denominator}` : ""),
          el("div", {class:"l"}, item.label, item.description ? el("div", {class:"d"}, item.description) : null),
          item.filter ? el("div", {class:"go"}, "View affected questions →") : null))));
    }
  }
  if (fb && fb.available) {
    body.appendChild(el("div", {style:"margin-top:20px"},
      el("h3", {}, "Failure attribution by pipeline layer"),
      el("div", {class:"sub", style:"margin:-4px 0 8px"},
        "The evaluator's own attribution: a question failing in both the full pipeline and the exact-evidence-only "
        + "condition is attributed to generation; one failing only with the full context, to the context. Separate "
        + "from final correctness. Click a layer to see its questions."),
      fb.layers.map(l => el("div", {class:"layer",
          onclick: () => { location.hash = `#/questions/${encodeURIComponent(id)}?layer=${encodeURIComponent(l.layer)}`; }},
        el("div", {class:"name"}, l.layer === "none" ? "no failure attributed" : l.layer),
        el("div", {class:"track"}, el("div", {class:"bar",
          style:`width:${Math.max(1.5, (l.share||0)*100)}%;background:${l.is_clean ? "var(--ok)" : "var(--series-2)"}`})),
        el("div", {class:"n"}, `${l.count} / ${l.total}`)))));
  }
  return el("section", {class:"asec"},
    el("div", {class:"asec-head"},
      el("div", {},
        el("h3", {}, "What needs attention"),
        el("div", {class:"q"}, "Where did questions fail, and which questions were they?"),
        el("div", {class:"why"}, "Counts of questions taken from this evaluation's own records. Each count opens exactly "
          + "those questions. These are observations to investigate, not a ranking or a verdict."))),
    body);
}

/* ============================================ ACCEPTANCE BENCHMARK RESULT */
// The controlled 300-question evaluation, with the provenance every number on
// it is tied to. Deliberately a SEPARATE section from the Overview headline:
// the headline answers "has the configured system been evaluated?", this
// answers "what does the benchmark say, and what produced it?". The section
// never renders a number without `is_current` and the warnings beside it.
async function renderAcceptance(view) {
  let a;
  try { a = await api("/api/acceptance/current"); } catch (e) { return; }
  const card = el("div", {class:"card"});
  card.appendChild(el("h3", {}, "Acceptance evaluation (controlled benchmark)"));

  if (!a.available) {
    card.appendChild(el("div", {class:"banner warn"}, el("b", {}, "⚠"),
      el("div", {class:"body"}, el("b", {}, "No benchmark result. "), a.reason)));
    if ((a.rejected || []).length) card.appendChild(rejectedList(a.rejected));
    view.appendChild(card);
    return;
  }

  const pv = a.provenance, h = a.headline;
  // freshness first, so a number is never read before its status
  card.appendChild(el("div", {class:"spread"},
    el("div", {class:"eyebrow"}, a.is_current ? "Current validated evaluation" : "Historical evaluation"),
    statusPill(pv.evaluation_status, a.freshness && a.freshness.reason)));
  for (const w of (a.warnings || [])) {
    card.appendChild(el("div", {class:"banner warn", style:"margin-top:10px"}, el("b", {}, "⚠"),
      el("div", {class:"body"}, w)));
  }
  if (a.freshness && a.freshness.reason && !a.is_current) {
    card.appendChild(el("div", {class:"sub", style:"margin-top:8px"}, "Freshness engine: ", a.freshness.reason));
    const diffs = (a.freshness.checks || {}).pipeline_differences || [];
    if (diffs.length) {
      card.appendChild(el("div", {style:"margin-top:8px"},
        el("div", {class:"eyebrow"}, "Settings that differ from the configured system"),
        el("table", {class:"tbl"},
          el("thead", {}, el("tr", {}, el("th", {}, "Setting"), el("th", {}, "This run"),
                              el("th", {}, "Configured now"), el("th", {}, "")) ),
          el("tbody", {}, diffs.map(d => el("tr", {},
            el("td", {class:"mono"}, d.field),
            el("td", {class:"mono"}, String(d.recorded)),
            el("td", {class:"mono"}, String(d.current)),
            el("td", {class:"sub"}, d.note)))))));
    }
  }

  if (h) {
    card.appendChild(el("div", {class:"hero", style:"margin-top:12px"},
      el("div", {class:"eyebrow"}, h.label, infoIcon(h.definition_key)),
      el("h2", {}, ratioText(h.value)),
      el("div", {class:"ident"}, h.sample_note, " rows pass the full rubric verdict")));
  }
  card.appendChild(el("div", {class:"sub", style:"margin-top:4px"}, a.not_the_live_indicator));

  // §3: the provenance the metrics are tied to
  card.appendChild(el("div", {style:"margin-top:14px"},
    el("div", {class:"eyebrow"}, "Data source"),
    kvList([
      ["Benchmark / evaluation", pv.evaluation],
      ["Benchmark file", pv.benchmark_file, true],
      ["Benchmark sha256", pv.benchmark_sha256, true],
      ["Run ID", pv.run_id, true],
      ["Artifact", pv.artifact, true],
      ["Evaluated", fmtDate(pv.evaluated_at)],
      ["Model", pv.model_label],
      ["Model revision", pv.model_revision, true],
      ["Adapter", pv.adapter],
      ["Retrieval configuration", pv.retrieval],
      ["Pipeline fingerprint", (pv.pipeline_fingerprint || {}).value, true],
      ["Rubric", pv.rubric, true],
      ["Questions", `${pv.questions} of ${pv.benchmark_questions} benchmark rows carry a verdict`],
      ["Evaluation status", pv.evaluation_status],
      ["Scoring basis", Object.entries(pv.scoring_basis || {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "not recorded"],
      ["Answer key", (pv.key_verification || {}).status || "not recorded"],
      ["Git commit", (pv.git_commit || "").slice(0, 12) + (pv.git_dirty ? " (working tree dirty)" : ""), true],
      ["Protocol", pv.protocol],
    ])));

  // the workbook's own seven gates
  if ((a.gates || []).length) {
    card.appendChild(el("div", {style:"margin-top:14px"},
      el("div", {class:"eyebrow"}, "Contractual gates (thresholds are the workbook's)"),
      el("table", {class:"tbl"},
        el("thead", {}, el("tr", {}, el("th", {}, "Gate"), el("th", {}, "Metric"), el("th", {}, "Threshold"),
                            el("th", {}, "Measured"), el("th", {}, ""))),
        el("tbody", {}, a.gates.map(g => el("tr", {},
          el("td", {class:"mono"}, g.gate_id),
          el("td", {}, g.metric, g.absolute ? el("span", {class:"sub"}, " · absolute") : null),
          el("td", {class:"mono"}, `${g.comparison} ${g.threshold}`),
          el("td", {class:"mono"}, g.measured == null ? "\u2013"
            : (g.unit === "count" ? String(g.measured) : ratioText(g.measured))),
          el("td", {}, mark(g.passed))))))));
  }

  // every rubric dimension, with its counts
  if ((a.metrics || []).length) {
    card.appendChild(el("div", {style:"margin-top:14px"},
      el("div", {class:"eyebrow"}, "Rubric dimensions"),
      el("table", {class:"tbl"},
        el("thead", {}, el("tr", {}, el("th", {}, "Metric"), el("th", {}, "Value"), el("th", {}, "Counts"), el("th", {}, ""))),
        el("tbody", {}, a.metrics.map(m => el("tr", {},
          el("td", {}, m.display_name, infoIcon(m.definition_key)),
          el("td", {class:"mono"}, m.value == null ? "not recorded" : fmtValue(m)),
          el("td", {class:"mono sub"}, m.sample_note || "–"),
          el("td", {class:"sub"}, m.note || (m.status === "missing" ? "not recorded by this run" : ""))))))));
  }

  if ((a.caveats || []).length) {
    card.appendChild(el("details", {style:"margin-top:12px"},
      el("summary", {}, `What this run does and does not establish (${a.caveats.length})`),
      el("ul", {class:"sub", style:"margin:8px 0 0;padding-left:18px"},
        a.caveats.map(c => el("li", {}, c)))));
  }
  if ((a.rejected || []).length) card.appendChild(rejectedList(a.rejected));
  view.appendChild(card);
}

// Why the displayed run is the one displayed: the runs that were not chosen,
// each with the condition it failed. Recency is the last tie-break, never a
// reason on its own.
function rejectedList(rejected) {
  return el("details", {style:"margin-top:12px"},
    el("summary", {}, `Other acceptance runs on this machine, and why they are not shown (${rejected.length})`),
    el("table", {class:"tbl", style:"margin-top:8px"},
      el("thead", {}, el("tr", {}, el("th", {}, "Run"), el("th", {}, "Not shown because"), el("th", {}, ""))),
      el("tbody", {}, rejected.map(r => el("tr", {},
        el("td", {class:"mono"}, r.run),
        el("td", {}, String(r.rejected_because).replace(/_/g, " ")),
        el("td", {class:"sub"}, r.detail || r.status_reason || ""))))));
}

/* ===================================================== QUESTION ANALYSIS */
// Shared by the Model analysis page (filters change in place) and the
// Questions page (filters change the address). The server filters.
const mark = (v, yes="✓", no="✗") => v === true ? el("span", {class:"mk y", title:"yes"}, yes)
  : v === false ? el("span", {class:"mk n", title:"no"}, no) : el("span", {class:"mk u", title:"not recorded"}, "–");
const word = (v, yes, no) => v === true ? el("span", {class:"yes"}, yes)
  : v === false ? el("span", {class:"no"}, no) : el("span", {class:"nm", title:"not recorded"}, "—");

async function questionAnalysis(host, id, query, navigate) {
  host.innerHTML = "";
  host.appendChild(el("div", {class:"loading"}, "Loading questions…"));
  const params = new URLSearchParams();
  for (const k of ["filter", "layer", "category", "q"]) if (query[k]) params.set(k, query[k]);
  const payload = await api(`/api/evaluation/experiments/${encodeURIComponent(id)}/questions${params.toString() ? "?" + params : ""}`);
  host.innerHTML = "";
  const go = navigate || ((changes) => {
    const next = {...query, ...changes};
    for (const k of Object.keys(next)) if (!next[k]) delete next[k];
    questionAnalysis(host, id, next, null).catch(err => {
      host.innerHTML = ""; host.appendChild(el("div", {class:"banner stop"}, el("b", {}, "✕"), el("div", {class:"body"}, String(err.message || err))));
    });
  });

  const byKey = Object.fromEntries(payload.filters.map(f => [f.key, f]));
  const chip = (key, label, count, on, title) => el("button", {class:"chip", "aria-pressed": on ? "true" : "false",
      title: title || "", onclick: () => go({filter: on ? null : key})},
    label, count !== null && count !== undefined ? el("span", {class:"c"}, count) : null);
  const primary = PRIMARY_FILTERS.map(k => byKey[k]).filter(f => f && f.available);
  const secondary = payload.filters.filter(f => f.available && !PRIMARY_FILTERS.includes(f.key));
  const more = el("select", {"aria-label":"more filters", onchange: (e) => go({filter: e.target.value})},
    el("option", {value:""}, "More filters…"),
    ...secondary.map(f => el("option", {value:f.key, selected: f.key === query.filter ? "selected" : null},
      `${f.label} (${f.count})`)));
  const search = el("input", {type:"search", placeholder:"search question text or id", value: query.q || "",
    style:"flex:1;min-width:200px", "aria-label":"search questions", onchange: (e) => go({q: e.target.value.trim()})});
  const cat = el("select", {"aria-label":"category", onchange: (e) => go({category: e.target.value})},
    el("option", {value:""}, "all categories"),
    ...payload.categories.map(c => el("option", {value:c, selected: c === query.category ? "selected" : null}, c)));
  const layer = el("select", {"aria-label":"failure layer", onchange: (e) => go({layer: e.target.value})},
    el("option", {value:""}, "all failure layers"),
    ...payload.layers.map(l => el("option", {value:l.key, selected: l.key === query.layer ? "selected" : null},
      `${l.key} (${l.count})`)));
  const applied = query.filter ? byKey[query.filter] : null;
  host.appendChild(el("div", {class:"qtools"},
    el("div", {class:"chips"}, chip("", "All", payload.total, !query.filter),
      primary.map(f => chip(f.key, f.label, f.count, query.filter === f.key, f.description))),
    el("div", {class:"row", style:"margin-top:10px"}, more, search, cat, layer),
    el("div", {class:"qmeta"}, el("b", {}, `${payload.matched} of ${payload.total} questions`),
      applied ? ` · ${applied.label}: ${applied.description}` : "",
      query.layer ? ` · failure layer ${query.layer}` : "",
      payload.filters.some(f => !f.available)
        ? ` · filters this run cannot answer are hidden: ${payload.filters.filter(f => !f.available).map(f => f.label).join(", ")}` : ""),
    el("div", {class:"qmeta", style:"margin-top:3px"}, payload.notes.failure_layer)));

  const labels = payload.trajectories || {};
  const open = (qid) => `#/question/${encodeURIComponent(id)}/${encodeURIComponent(qid)}`;
  const body = el("tbody");
  if (!payload.questions.length) body.appendChild(el("tr", {}, el("td", {colspan:10}, el("div", {class:"empty"}, "no question matches"))));
  for (const r of payload.questions) {
    const validation = r.generated === false ? el("span", {class:"nm"}, "no answer")
      : el("span", {class:"rf"}, word(r.validation_raw_ok, "pass", "fail"), el("span", {class:"arrow"}, "→"),
          word(r.validation_final_ok, "pass", "fail"));
    body.appendChild(el("tr", {class:"click", onclick:()=>{location.hash = open(r.id);}},
      el("td", {class:"mono"}, el("a", {href:open(r.id)}, r.id)),
      el("td", {class:"qtext"}, r.question.length > 110 ? r.question.slice(0,110)+"…" : r.question,
        el("div", {class:"sub"}, [r.category, r.expected_behavior && "expects " + r.expected_behavior,
          r.generated ? null : "no model call: " + (r.skipped_reason || "not generated")].filter(Boolean).join(" · "))),
      el("td", {title: labels[r.trajectory] || ""}, el("span", {class:"rf"}, mark(r.correct_raw),
        el("span", {class:"arrow"}, "→"), mark(r.correct_final))),
      el("td", {}, word(r.retrieval_ok, "ok", "failed")),
      el("td", {}, validation),
      el("td", {class:"sub"}, r.repair ? String(r.repair).split("+").join(", ") : (r.generated ? "none" : "—")),
      el("td", {}, word(r.citation_ok, "valid", "invalid")),
      el("td", {class:"num mono"}, r.selected_evidence_count ?? el("span", {class:"nm"}, "—")),
      el("td", {class:"num mono sub"}, typeof r.generation_ms === "number" ? (r.generation_ms/1000).toFixed(1)+" s" : "—"),
      el("td", {class:"num mono sub"}, r.tokens_generated ?? "—")));
  }
  host.appendChild(el("div", {class:"scroll hscroll"}, el("table", {},
    el("caption", {class:"sr-only"}, "Questions in this evaluation"),
    el("thead", {}, el("tr", {}, el("th", {}, "Id"), el("th", {}, "Question"),
      el("th", {title:"raw correctness → final correctness"}, "Raw → Final"), el("th", {}, "Retrieval"),
      el("th", {title:"deterministic validation, raw → final"}, "Validation"), el("th", {}, "Repair"),
      el("th", {}, "Citation"), el("th", {class:"num", title:"evidence items given to the model"}, "Evidence"),
      el("th", {class:"num"}, "Gen. time"), el("th", {class:"num"}, "Tokens"))),
    body)));
}

V.questions = async (id, query = {}) => {
  const view = $("#view");
  if (!id) {
    // no run chosen: the current evaluation, if the backend has one
    const ids = currentEvaluationIds();
    if (ids.length) { location.hash = `#/questions/${ids[0]}`; return; }
    view.innerHTML = "";
    const evals = S.experiments.filter(e => e.kind === "evaluation");
    view.appendChild(el("div", {class:"card"}, el("h3", {}, "Choose a run to inspect question by question"),
      el("ul", {}, evals.map(e => el("li", {style:"margin:5px 0"},
        el("a", {href:`#/questions/${e.experiment_id}`}, e.name), " ", statusPill(e.status))))));
    return;
  }
  const exp = S.experiments.find(e => e.experiment_id === id);
  const isCurrent = currentEvaluationIds().includes(id);
  const host = el("div");
  const go = (changes) => {
    const next = new URLSearchParams();
    for (const k of ["filter", "layer", "category", "q"]) if (query[k]) next.set(k, query[k]);
    for (const [k, v] of Object.entries(changes)) { if (v) next.set(k, v); else next.delete(k); }
    location.hash = `#/questions/${id}${next.toString() ? "?" + next : ""}`;
  };
  const head = el("div", {class:"pagehead"},
    el("div", {},
      el("div", {class:"eyebrow"}, isCurrent ? "Current model" : "Historical experiment"),
      el("h2", {}, "Questions"),
      el("div", {class:"lede"}, exp ? provenanceOf(exp) : id)),
    el("div", {class:"row"}, exp ? statusPill(exp.status, exp.status_reason) : null,
      el("a", {href: isCurrent ? "#/analysis" : `#/experiment/${id}`}, el("button", {}, "← Model analysis"))));
  const card = el("div", {class:"card flush"}, host);
  await questionAnalysis(host, id, query, go);
  view.innerHTML = "";
  view.appendChild(head);
  if (!isCurrent && exp) view.appendChild(el("div", {class:"banner warn"}, el("b", {}, "⚠"),
    el("div", {class:"body"}, "These questions belong to a historical experiment, not to the current model's evaluation.")));
  view.appendChild(card);
};

/* ======================================================= QUESTION DETAIL */
V.question = async (id, questionId) => {
  const view = $("#view");
  const payload = await api(`/api/evaluation/experiments/${encodeURIComponent(id)}/questions/${encodeURIComponent(questionId)}`);
  view.innerHTML = "";

/* ----------------------------------------------------------------- router */
function parseHash() {
  const raw = (location.hash || "#/analysis").slice(1);
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  return { route: parts[0] || "analysis", args: parts.slice(1).map(decodeURIComponent), query };
}

function activeTab(route, args) {
  if (route === "experiment") return currentEvaluationIds().includes(args[0]) ? "analysis" : "experiments";
  const tab = PARENT[route] || route;
  return TABS.some(([r]) => r === tab) ? tab : "analysis";
}

async function render() {
  const { route, args, query } = parseHash();
  const tab = activeTab(route, args);
  for (const a of $("#nav").children) {
    const on = a.dataset.route === tab;
    a.className = on ? "on" : "";
    a.setAttribute("aria-current", on ? "page" : "false");
  }
  const view = $("#view");
  view.innerHTML = "";
  view.appendChild(el("div", {class:"loading"}, "Loading…"));
  try {
    if (route === "experiment") await V.experiment(args[0], query);
    else if (route === "question") await V.question(args[0], args[1]);
    else if (route === "training") await V.training(args[0]);
    else if (route === "questions") await V.questions(args[0], query);
    else if (route === "compare") await V.compare(query);
    else if (V[route]) await V[route]();
    else await V.analysis();
  } catch (err) {
    view.innerHTML = "";
    view.appendChild(el("div", {class:"banner stop"}, el("b", {}, "✕"),
      el("div", {class:"body"}, el("b", {}, "This view could not be built. "), String(err.message || err))));
  }
}

function buildNav() {
  $("#nav").append(...TABS.map(([route, label]) =>
    el("a", {href:`#/${route}`, "data-route":route}, label)));
}

async function boot() {
  buildNav();
  $("#theme").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
  });
  $("#refresh").addEventListener("click", async () => {
    const button = $("#refresh"); button.disabled = true; button.textContent = "rescanning…";
    try { await api("/api/refresh", {method:"POST"}); S.cache = {}; await load(); await render(); }
    catch (err) { alert(err.message); }
    finally { button.disabled = false; button.textContent = "Rescan artifacts"; }
  });
  window.addEventListener("hashchange", render);
  await load();
  await render();
  // notice when a new run appears on disk without forcing a rescan
  setInterval(async () => {
    try {
      const health = await api("/api/system/health");
      if (S.fingerprint && health.fingerprint !== S.fingerprint) {
        $("#alerts").innerHTML = "";
        $("#alerts").appendChild(el("div", {class:"banner info"}, el("b", {}, "i"),
          el("div", {class:"body"}, "New or changed artifacts are on disk. ",
            el("a", {href:"#", onclick:(e)=>{e.preventDefault(); $("#refresh").click();}}, "Rescan to include them."))));
      }
      S.fingerprint = health.fingerprint;
    } catch { /* the server went away; the page stays usable */ }
  }, 20000);
}

async function load() {
  const [defs, experiments, current, health] = await Promise.all([
    api("/api/metrics/definitions"), api("/api/experiments"),
    api("/api/system/current-model"), api("/api/system/health"),
  ]);
  S.defs = defs; S.defsByKey = defs.by_key;
  S.experiments = experiments.experiments;
  S.current = current;
  S.fingerprint = health.fingerprint;
  $("#alerts").innerHTML = "";
  $("#head-sub").textContent =
    `${S.experiments.length} experiments · scanned ${fmtDate(health.scanned_at)} · read-only: no model, no database`;
}

boot();
</script>
</body>
</html>
