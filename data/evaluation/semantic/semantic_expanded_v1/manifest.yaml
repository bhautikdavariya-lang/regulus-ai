# Stage 10 expanded semantic corpus: tracked configuration (version 2 schema).
# Generated artifacts live in ./generated/ (gitignored). The Stage 8 corpus in
# ../manifest.yaml and ../generated/ is untouched.
version: 2

corpus:
  name: semantic_expanded_v1
  rationale: >
    Test whether the Stage 9 hybrid gains survive realistic semantic
    competition. Scope: the regulatory areas the benchmarks live in (human
    drugs, medical devices, general provisions) taken whole, so that every
    benchmark target competes with its real neighbours, plus all retrievable
    drug- and device-sector guidance. Large device-classification parts 870
    and 880 are included as high-volume distractors; the other classification
    parts (862-892 except those two) are excluded to keep the corpus within
    the CPU budget. Sections outside the scope that the Stage 8 corpus needed
    are added individually.

embedding:
  model_id: "BAAI/bge-small-en-v1.5"
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
  dimension: 384
  pooling: "cls"
  normalize: true
  max_length: 512
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 16

selection:
  ecfr:
    # whole subchapters
    subchapters: ["C", "D"]            # Drugs: General (200-299); Drugs for Human Use (300-499)
    # whole parts
    parts:
      - "1"    # general enforcement (large, mostly unrelated: import, LAAF, FSVP)
      - "3"    # product jurisdiction (Retrieval programme, 2026-10-20: these seven parts were absent from
      - "4"    # combination products       the index, so semantic search could never return them)
      - "70"   # color additives
      - "73"   # color additives exempt from certification
      - "74"   # color additives subject to certification
      - "82"   # certified provisionally listed colors
      - "117"  # human food CGMP and preventive controls
      - "7"    # enforcement policy, recalls
      - "10"   # administrative practices
      - "11"   # electronic records / signatures
      - "20"   # public information
      - "50"   # protection of human subjects
      - "56"   # IRBs
      - "58"   # GLP
      - "801"  # device labeling
      - "803"  # medical device reporting
      - "806"  # corrections and removals
      - "807"  # establishment registration, 510(k)
      - "808"  # state exemptions
      - "810"  # medical device recall authority
      - "812"  # IDE
      - "814"  # PMA
      - "820"  # QMSR
      - "821"  # device tracking
      - "822"  # postmarket surveillance
      - "830"  # UDI
      - "870"  # cardiovascular device classification (distractor volume)
      - "880"  # general hospital device classification (distractor volume)
    # individual sections outside the scope above (Stage 8 targets/distractors)
    sections: ["101.36", "101.9", "101.4", "111.1", "170.3", "100.1", "606.100", "1141.10"]
  guidance:
    sectors: ["drug", "device"]
    # dockets outside those sectors that the benchmarks reference
    dockets:
      - "FDA-2003-D-0143"   # Part 11 scope and application (sector: supplement)
      - "FDA-2018-D-2074"   # voluntary recalls (sector: food)
      - "FDA-2007-D-0372"   # dietary supplement AER Q&A (sector: supplement)
      - "FDA-2015-D-4848"   # human factors combination products (sector: device, kept explicit)
      - "FDA-2018-D-0671"   # small-business employee count (Stage 7 fallback distractor)
    max_chunks_per_document: 12

  # Benchmark targets (retrieval_v1 + retrieval_v2 + baseline_v1). Everything
  # else in scope is a distractor.
  targets:
    ecfr_sections:
      - "820.10"
      - "820.1"
      - "820.3"
      - "820.7"
      - "820.35"
      - "820.45"
      - "211.132"
      - "211.68"
      - "211.142"
      - "211.100"
      - "211.1"
      - "50.20"
      - "50.25"
      - "56.103"
      - "101.36"
      - "807.81"
      - "807.87"
      - "803.50"
      - "11.1"
      - "11.3"
      - "11.10"
      - "11.50"
      - "11.100"
      - "11.200"
      - "7.40"
      - "201.327"
      - "801.109"
      - "314.50"
      - "314.3"
      - "312.20"
      - "1.1"
      - "201.66"
      - "330.1"
      - "111.1"
      - "830.20"
    guidance_dockets:
      - "FDA-2003-D-0143"
      - "FDA-2008-D-0559"
      - "FDA-2011-D-0469"
      - "FDA-2015-D-4599"
