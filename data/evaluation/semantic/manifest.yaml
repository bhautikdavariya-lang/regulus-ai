# Stage 8 semantic retrieval experiment: tracked configuration.
# Everything under data/evaluation/semantic/generated/ is derived from this
# file plus the read-only database and is gitignored.
version: 1

embedding:
  model_id: "BAAI/bge-small-en-v1.5"
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
  dimension: 384
  pooling: "cls"          # bge models use the [CLS] token
  normalize: true         # L2-normalised -> cosine similarity == dot product
  max_length: 512         # tokens; longer texts are truncated
  # bge recommends this prefix for short queries in query->passage retrieval;
  # it is applied to queries only, never to corpus passages.
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 16

selection:
  # Whole eCFR sections (every live paragraph). role: why it is in the corpus.
  ecfr_sections:
    # retrieval_v1 / baseline_v1 targets
    - {section: "820.10", role: target}   # QMSR requirements; 820.10(c) = design and development
    - {section: "820.1",  role: target}
    - {section: "820.3",  role: target}
    - {section: "820.7",  role: target}
    - {section: "820.35", role: target}
    - {section: "820.45", role: target}
    - {section: "211.132", role: target}  # tamper-evident packaging
