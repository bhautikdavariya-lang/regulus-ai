    - {section: "211.142", role: target}  # warehousing / storage conditions (baseline-024)
    - {section: "211.100", role: target}
    - {section: "211.1",   role: target}
    - {section: "50.20",   role: target}  # informed consent
    - {section: "50.25",   role: target}
    - {section: "56.103",  role: target}  # IRB review
    - {section: "101.36",  role: target}  # dietary supplement nutrition labeling
