# Stage 13 training dataset (v2): Stage 11 generators plus the grounding
# categories that target the Stage 12 failure.
#
# Build:    python scripts/prepare_training_data.py --config configs/training_v2.yaml
# Validate: python scripts/validate_training_data.py --config configs/training_v2.yaml
#
# configs/training.yaml (v1) is untouched and still reproduces the Stage 11
# artifact exactly; the new categories simply carry no share there.

dataset:
  version: v2
  target_examples: 10000
  seed: 42
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  output_dir: data/training/datasets

sources:
  use_ecfr: true
  use_guidance: true
  retrievable_guidance_only: true

quality:
  allow_unverified_sources: false
  min_paragraph_chars: 60
  max_paragraph_chars: 1500
  max_context_chars: 3600
  near_duplicate_jaccard: 0.9
  benchmark_jaccard: 0.75
  benchmark_jaccard_same_identifiers: 0.5
  max_paragraph_examples_per_section: 2
  max_definition_examples_per_section: 12
  max_guidance_examples_per_document: 3

# Composition changed from v1, not scale. Stage 11 was 5.3 % abstention and
# every positive example had perfectly matching context, which taught
# "context present -> answer". v2 holds 20 % refusal-required examples, of
# which three quarters are the new grounding categories where the supplied
# context is legitimate and only the request/context relationship decides the
# correct behaviour. citation_grounding is the deliberate counterweight: it
# answers, with distractors present, so the refusal share cannot be satisfied
# by refusing more often.
categories:
  # answerable (0.80)
  direct_cfr: 0.20
  section_paragraph: 0.15
  definition: 0.09
  relationship: 0.08
  fda_guidance: 0.10
  cfr_vs_guidance: 0.05
  citation: 0.04
  multi_context: 0.04
  citation_grounding: 0.05
  # refusal-required (0.20)
  abstention: 0.08
  context_mismatch: 0.06
  wrong_context: 0.04
  partial_context: 0.01
  guidance_mismatch: 0.01

benchmarks:
  - data/evaluation/datasets/baseline_v1.jsonl
  - data/evaluation/datasets/retrieval_v1.jsonl
  - data/evaluation/datasets/retrieval_v2.jsonl
