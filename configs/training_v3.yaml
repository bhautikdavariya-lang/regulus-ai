# Stage 14 training dataset (v3): rebalanced against the measured Stage 13
# failures. v1 and v2 are untouched and still reproduce byte for byte.
#
#   python scripts/prepare_training_data.py --config configs/training_v3.yaml
#   python scripts/validate_training_data.py --config configs/training_v3.yaml
#
# What the Stage 13 evaluation showed, and what changed here:
#
#   * 14 of 20 scored failures were the same shape: the model described which
#     documents had been retrieved instead of answering. v2 was 20.1 %
#     refusal-required and every one of those 2,000 answers opened with the
#     same frame, so the frame was learned rather than the judgment.
#     -> refusal share cut to 13 %, refusal openings varied four ways, and
#        three answer-side categories added (grounded_definition,
#        grounded_topic, guidance_answer) that lead with the substance.
#   * Part 1400 was answered by asserting the eCFR "contains" it and attaching
#     retrieved guidance titles. Every v2 fake-part example had eCFR context.
#     -> fake_part_guidance_context added.
#   * The grounding wins (314.999, the storage-temperature case) came from
#     context_mismatch / wrong_context / partial_context, so those are kept.

dataset:
  version: v3
  target_examples: 10000
  seed: 42
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  output_dir: data/training/datasets

sources:
  use_ecfr: true
  use_guidance: true
  retrievable_guidance_only: true

quality:
  allow_unverified_sources: false
  min_paragraph_chars: 60
  max_paragraph_chars: 1500
  max_context_chars: 3600
  near_duplicate_jaccard: 0.9
  benchmark_jaccard: 0.75
  benchmark_jaccard_same_identifiers: 0.5
  max_paragraph_examples_per_section: 2
  max_definition_examples_per_section: 12
  max_guidance_examples_per_document: 3
  # Stage 14 generator behaviour, opted into here only
  varied_refusal_openings: true
  guidance_context_negatives: true

# 87 % answerable / 13 % refusal-required, against v2's 79.9 / 20.1.
# The grounding categories that produced the Stage 13 wins are kept but
# trimmed; the three new answer categories are the counterweight.
categories:
  # answerable (0.87)
  direct_cfr: 0.17
  section_paragraph: 0.13
  definition: 0.08
  relationship: 0.07
  fda_guidance: 0.08
  cfr_vs_guidance: 0.04
  citation: 0.04
  multi_context: 0.04
  citation_grounding: 0.05
  grounded_definition: 0.06
  grounded_topic: 0.06
  guidance_answer: 0.05
  # refusal-required (0.13)
  abstention: 0.04
  context_mismatch: 0.05
  wrong_context: 0.03
  partial_context: 0.005
  guidance_mismatch: 0.005

benchmarks:
  - data/evaluation/datasets/baseline_v1.jsonl
  - data/evaluation/datasets/retrieval_v1.jsonl
  - data/evaluation/datasets/retrieval_v2.jsonl
