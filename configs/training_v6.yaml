# Stage 6 training dataset (v6). Generated by scripts/prepare_stage6_dataset.py
# from artifacts/stage5_stage6/stage5_baseline_20260923/stage5/stage5_training_plan.json; the category shares below are the Stage 5 plan's recommended
# composition, normalised. Do not hand-edit: regenerate from the plan instead.
#
#   python scripts/prepare_stage6_dataset.py --plan artifacts/stage5_stage6/stage5_baseline_20260923/stage5/stage5_training_plan.json
#
# Two things differ from v1-v3 and both are opt-in flags, so those datasets
# still reproduce byte for byte:
#   * exclude_benchmark_groups: an example is dropped when its split group
#     (section or part) is named by ANY benchmark question, so no evaluation
#     section is trained on at all;
#   * the Stage 6 categories multi_provision / range_provision /
#     partial_provision, whose answers follow the Stage 4 generation contract.

dataset:
  version: v6
  target_examples: 6000
  seed: 42
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  output_dir: data/training/datasets
sources:
  use_ecfr: true
  use_guidance: true
  retrievable_guidance_only: true
quality:
  allow_unverified_sources: false
  min_paragraph_chars: 60
  max_paragraph_chars: 1500
  max_context_chars: 3600
  near_duplicate_jaccard: 0.9
  benchmark_jaccard: 0.75
  benchmark_jaccard_same_identifiers: 0.5
  max_paragraph_examples_per_section: 2
  max_definition_examples_per_section: 12
  max_guidance_examples_per_document: 3
  varied_refusal_openings: true
  guidance_context_negatives: true
  exclude_benchmark_groups: true
categories:
  abstention: 0.0554
  citation: 0.024
  citation_grounding: 0.0583
  context_mismatch: 0.0503
  definition: 0.024
  direct_cfr: 0.1165
  fda_guidance: 0.032
  grounded_definition: 0.0554
  grounded_topic: 0.0685
  guidance_answer: 0.04
  guidance_mismatch: 0.008
  multi_provision: 0.1428
  partial_context: 0.0234
  partial_provision: 0.0794
  range_provision: 0.1108
  section_paragraph: 0.0691
  wrong_context: 0.0423
benchmarks:
- data/evaluation/datasets/baseline_v1.jsonl
- data/evaluation/datasets/retrieval_v1.jsonl
- data/evaluation/datasets/retrieval_v2.jsonl
- data/evaluation/datasets/stage5_v1.jsonl
