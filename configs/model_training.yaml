# Stage 12: first LoRA fine-tune of Qwen3-0.6B on the Stage 11 dataset.
# Run explicitly:  python scripts/train_model.py --config configs/model_training.yaml
# Nothing here is read by the inference/RAG code path.

model:
  name: Qwen3-0.6B
  # base model id, cache dir, device and dtype come from the existing model config
  config: configs/model.yaml

dataset:
  train: data/training/datasets/training_v1.jsonl
  validation: data/training/datasets/validation_v1.jsonl
  test: data/training/datasets/test_v1.jsonl          # never read during training
  manifest: data/training/datasets/manifest_v1.json
  # identity of the Stage 11 artifact; training refuses to start on anything else
  expected_hash: bee32e320fc5c5072b040efc5b5a1caf707bce09c96affd05586a0f039e77a54
  expected_counts:
    train: 7566
    validation: 962
    test: 917
  seed: 42
  # validation examples used for checkpoint selection (a hash-ordered subset:
  # a full pass over 962 examples costs ~2 h per evaluation on this CPU)
  eval_subset: 64
  # protected evaluation assets: hashes are recorded before training and re-checked after
  protected:
    - data/evaluation/datasets/baseline_v1.jsonl
    - data/evaluation/datasets/retrieval_v1.jsonl
    - data/evaluation/datasets/retrieval_v2.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # verified programmatically against the loaded architecture before training
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 2.0e-4
  num_train_epochs: 1
  # CPU budget for the first run: 40 optimizer steps x 8 examples = 320 training
  # examples (~4 h at ~45 s per example). Set to -1 to train num_train_epochs.
  max_steps: 40
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 4
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 2
  eval_strategy: steps
  eval_steps: 20
  save_strategy: steps
  save_steps: 20
  save_total_limit: 2
  early_stopping_patience: 2
  # sequence budget: p95 of the rendered examples is 1,198 tokens; longer examples
  # are skipped (never cut mid-answer) and counted in the report
  max_seq_length: 1280
  over_length_policy: skip
  gradient_checkpointing: true
  seed: 42

output:
  directory: models/qwen3-0.6b-lora/stage12_v1
  smoke_directory: models/qwen3-0.6b-lora/smoke_tmp
