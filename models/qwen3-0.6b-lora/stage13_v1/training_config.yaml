  eval_subset: 100
  eval_stratified: true
  protected:
  - data/evaluation/datasets/baseline_v1.jsonl
  - data/evaluation/datasets/retrieval_v1.jsonl
  - data/evaluation/datasets/retrieval_v2.jsonl
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
